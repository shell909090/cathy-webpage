<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none">
  <!-- Background circle -->
  <circle cx="200" cy="140" r="130" fill="#F0F7FF"/>
  <!-- Board -->
  <rect x="70" y="40" width="140" height="100" rx="6" fill="#fff" stroke="#4A90D9" stroke-width="2.5"/>
  <line x1="90" y1="70" x2="190" y2="70" stroke="#E2E8F0" stroke-width="2"/>
  <line x1="90" y1="85" x2="170" y2="85" stroke="#FFB800" stroke-width="2.5"/>
  <circle cx="185" cy="85" r="4" fill="#4CAF50"/>
  <line x1="90" y1="105" x2="160" y2="105" stroke="#E2E8F0" stroke-width="2"/>
  <line x1="90" y1="118" x2="145" y2="118" stroke="#FF6B35" stroke-width="2.5"/>
  <!-- Teacher figure -->
  <circle cx="260" cy="110" r="28" fill="#FFB800" opacity="0.3"/>
  <circle cx="260" cy="108" r="16" fill="#FFB800"/>
  <circle cx="254" cy="103" r="2.5" fill="#fff"/>
  <circle cx="266" cy="103" r="2.5" fill="#fff"/>
  <path d="M252 112 Q260 118 268 112" stroke="#D4A000" stroke-width="1.5" fill="none"/>
  <!-- Student figure -->
  <circle cx="120" cy="200" r="22" fill="#4A90D9" opacity="0.25"/>
  <circle cx="120" cy="198" r="14" fill="#4A90D9"/>
  <circle cx="115" cy="194" r="2" fill="#fff"/>
  <circle cx="125" cy="194" r="2" fill="#fff"/>
  <path d="M114 202 Q120 207 126 202" stroke="#3570B0" stroke-width="1.5" fill="none"/>
  <!-- Speech bubbles -->
  <rect x="180" y="60" width="80" height="30" rx="15" fill="#fff" stroke="#FF6B35" stroke-width="1.5"/>
  <text x="220" y="80" text-anchor="middle" font-size="10" fill="#FF6B35" font-weight="600" font-family="sans-serif">Hello!</text>
  <rect x="260" y="170" width="80" height="30" rx="15" fill="#fff" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="300" y="190" text-anchor="middle" font-size="10" fill="#4CAF50" font-weight="600" font-family="sans-serif">Hi ~</text>
  <!-- Stars -->
  <text x="310" y="82" font-size="12">⭐</text>
  <text x="95" y="155" font-size="10">✨</text>
  <text x="330" y="235" font-size="8">🌟</text>
</svg>
